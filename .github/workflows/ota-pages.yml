name: OTA Pages Deploy

on:
  push:
    tags:
      - "v*"
    branches:
      - "feature/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "PlatformIO environment"
        required: true
        default: "main"
      channel:
        description: "Deploy channel (production=ota, staging=ota/staging)"
        required: true
        default: "staging"
      version:
        description: "Optional firmware version (e.g. 1.0.6)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          ENV_NAME="${{ github.event.inputs.environment }}"
          if [ -z "$ENV_NAME" ]; then
            ENV_NAME="main"
          fi

          VERSION_INPUT="${{ github.event.inputs.version }}"
          CHANNEL_INPUT="${{ github.event.inputs.channel }}"

          # Derive channel:
          # - tags always deploy to production path (ota/)
          # - feature branch pushes deploy to staging path (ota/staging/)
          # - manual runs can choose via input
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            CHANNEL="production"
          elif [ -n "$CHANNEL_INPUT" ]; then
            CHANNEL="$CHANNEL_INPUT"
          else
            CHANNEL="staging"
          fi

          if [ "$CHANNEL" = "production" ]; then
            OTA_DIR="ota"
          else
            OTA_DIR="ota/staging"
          fi

          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
            TAG="${GITHUB_REF_NAME}"
            if [ -z "$TAG" ]; then
              TAG="manual-${VERSION_INPUT}"
            fi
          else
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              TAG="${GITHUB_REF_NAME}"
              VERSION="${TAG#v}"
            else
              # Fallback to currently configured app version for preview builds.
              VERSION="$(sed -n -E 's/.*APP_FIRMWARE_VERSION=\\"([^"]+)\\".*/\1/p' platformio.ini | head -n1)"
              if [ -z "$VERSION" ]; then
                VERSION="0.0.0-dev"
              fi
              TAG="${GITHUB_REF_NAME}"
            fi
          fi

          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "ota_dir=$OTA_DIR" >> "$GITHUB_OUTPUT"

      - name: Set APP_FIRMWARE_VERSION for build
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          sed -E -i 's#-DAPP_FIRMWARE_VERSION=\\"[^"]+\\"#-DAPP_FIRMWARE_VERSION=\\"'"${VERSION}"'\\"#' platformio.ini
          grep "APP_FIRMWARE_VERSION" platformio.ini

      - name: Build firmware
        run: pio run -e "${{ steps.meta.outputs.env_name }}"

      - name: Prepare OTA files
        shell: bash
        env:
          ENV_NAME: ${{ steps.meta.outputs.env_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          OTA_DIR: ${{ steps.meta.outputs.ota_dir }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          FW=".pio/build/${ENV_NAME}/firmware.bin"
          if [ ! -f "$FW" ]; then
            echo "Firmware not found: $FW"
            exit 1
          fi

          mkdir -p "dist/${OTA_DIR}"
          cp "$FW" "dist/${OTA_DIR}/firmware.bin"

          BASE_URL="https://${OWNER}.github.io/${REPO}"
          cat > "dist/${OTA_DIR}/manifest.json" <<EOF
          {
            "version": "${VERSION}",
            "url": "${BASE_URL}/${OTA_DIR}/firmware.bin"
          }
          EOF

          echo "manifest_url=${BASE_URL}/${OTA_DIR}/manifest.json" >> "$GITHUB_ENV"
          echo "firmware_url=${BASE_URL}/${OTA_DIR}/firmware.bin" >> "$GITHUB_ENV"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployed URLs
        run: |
          echo "Channel: ${{ steps.meta.outputs.channel }}"
          echo "Manifest: ${manifest_url}"
          echo "Firmware: ${firmware_url}"
