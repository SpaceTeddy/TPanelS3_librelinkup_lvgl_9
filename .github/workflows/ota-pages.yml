name: OTA Staging Deploy

# Manual-only: deploy a test build to the staging OTA channel.
# Prod channel (ota/) is preserved from the latest GitHub release.
# Device manifest URL for testing: https://<owner>.github.io/<repo>/ota/staging/manifest.json

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "PlatformIO environment"
        required: true
        default: "main"
      version:
        description: "Staging version label (e.g. 1.0.25-test)"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build staging firmware
        env:
          FIRMWARE_VERSION: ${{ github.event.inputs.version }}
        run: pio run -e "${{ github.event.inputs.environment }}"

      - name: Prepare OTA pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_NAME: ${{ github.event.inputs.environment }}
          VERSION: ${{ github.event.inputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          FW=".pio/build/${ENV_NAME}/firmware.bin"
          if [ ! -f "$FW" ]; then
            echo "Firmware not found: $FW"
            exit 1
          fi

          BASE_URL="https://${OWNER}.github.io/${REPO}"
          mkdir -p dist/ota dist/ota/staging

          # Prod channel: restore from latest GitHub release so prod devices are unaffected
          LATEST_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo "")
          LATEST_VERSION="${LATEST_TAG#v}"

          if [ -n "$LATEST_TAG" ]; then
            echo "Restoring prod from release ${LATEST_TAG}..."
            gh release download "$LATEST_TAG" \
              --asset "firmware-${ENV_NAME}.bin" \
              --output dist/ota/firmware.bin \
              --clobber
            printf '{\n  "version": "%s",\n  "url": "%s/ota/firmware.bin"\n}\n' \
              "$LATEST_VERSION" "$BASE_URL" > dist/ota/manifest.json
          else
            echo "No release found — using staging firmware for prod channel too"
            cp "$FW" dist/ota/firmware.bin
            printf '{\n  "version": "%s",\n  "url": "%s/ota/firmware.bin"\n}\n' \
              "$VERSION" "$BASE_URL" > dist/ota/manifest.json
            LATEST_VERSION="$VERSION"
          fi

          # Staging channel: freshly built firmware
          cp "$FW" dist/ota/staging/firmware.bin
          printf '{\n  "version": "%s",\n  "url": "%s/ota/staging/firmware.bin"\n}\n' \
            "$VERSION" "$BASE_URL" > dist/ota/staging/manifest.json

          echo "PROD    manifest: ${BASE_URL}/ota/manifest.json → v${LATEST_VERSION}"
          echo "STAGING manifest: ${BASE_URL}/ota/staging/manifest.json → v${VERSION}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
