name: OTA Staging Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "PlatformIO environment"
        required: true
        default: "main"
      version:
        description: "Staging version label (e.g. 1.0.27-test)"
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Build staging firmware
        env:
          FIRMWARE_VERSION: ${{ github.event.inputs.version }}
        run: pio run -e "${{ github.event.inputs.environment }}"
      - name: Prepare OTA pages
        shell: bash
        env:
          ENV_NAME: ${{ github.event.inputs.environment }}
          VERSION: ${{ github.event.inputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -e
          FW=".pio/build/${ENV_NAME}/firmware.bin"
          if [ ! -f "$FW" ]; then
            echo "Firmware not found: $FW"
            exit 1
          fi
          BASE_URL="https://${OWNER}.github.io/${REPO}"
          mkdir -p dist/ota dist/ota/staging
          echo "Fetching prod channel from ${BASE_URL}/ota/ ..."
          if curl -sf --max-time 20 "${BASE_URL}/ota/firmware.bin" -o dist/ota/firmware.bin \
          && curl -sf --max-time 10 "${BASE_URL}/ota/manifest.json" -o dist/ota/manifest.json; then
            PROD_VERSION=$(python3 -c "import json,sys; print(json.load(open('dist/ota/manifest.json')).get('version','?'))" 2>/dev/null || echo "?")
            echo "Prod channel restored: v${PROD_VERSION} (unchanged)"
          else
            echo "No existing prod channel found — using this build as prod fallback"
            cp "$FW" dist/ota/firmware.bin
            printf '{\n  "version": "%s",\n  "url": "%s/ota/firmware.bin"\n}\n' \
              "$VERSION" "$BASE_URL" > dist/ota/manifest.json
            PROD_VERSION="$VERSION (fallback)"
          fi
          cp "$FW" dist/ota/staging/firmware.bin
          printf '{\n  "version": "%s",\n  "url": "%s/ota/staging/firmware.bin"\n}\n' \
            "$VERSION" "$BASE_URL" > dist/ota/staging/manifest.json
          echo ""
          echo "PROD    → v${PROD_VERSION}  (${BASE_URL}/ota/manifest.json)"
          echo "STAGING → v${VERSION}  (${BASE_URL}/ota/staging/manifest.json)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
