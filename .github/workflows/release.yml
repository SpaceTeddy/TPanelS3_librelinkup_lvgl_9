name: PlatformIO Release + OTA Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "PlatformIO environment"
        required: true
        default: "main"
      version:
        description: "Release tag (e.g. v1.3.0)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        required: true
        default: "false"
      generate_notes:
        description: "Use GitHub auto-generated release notes"
        required: true
        default: "true"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          ENV_NAME="${{ github.event.inputs.environment }}"
          if [ -z "$ENV_NAME" ]; then ENV_NAME="main"; fi

          VERSION_INPUT="${{ github.event.inputs.version }}"
          if [ -n "$VERSION_INPUT" ]; then
            TAG="$VERSION_INPUT"
            VERSION="${VERSION_INPUT#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          # No restore-keys on purpose. The key changes with every
          # platformio.ini edit -- including the platform line, which this
          # project switches between core 2.x and core 3.x. A loose fallback
          # then restores a cache built for the *other* platform, and
          # PlatformIO spends the run repairing it (visible as the same tool
          # being installed three times from different sources). A cold cache
          # costs a few minutes; a mismatched one costs the build.
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        # intelhex: tool-esptoolpy's bootloader-build step imports it but does
        # not install it itself - without this, "pio run" fails with
        # ModuleNotFoundError: No module named 'intelhex'.
        run: pip install --upgrade platformio intelhex

      # pioarduino declares framework-arduinoespressif32 as an *optional*
      # package, so PlatformIO never installs it on its own. With
      # custom_sdkconfig set, the builder always takes its "Reinstall Arduino
      # framework" path here -- it looks for a hash line in sdkconfig.defaults,
      # which is gitignored and therefore never present in CI -- and that path
      # calls exists(FRAMEWORK_DIR) on a None path: TypeError, build aborts.
      # Installing the package up front is what keeps CI green. The URL is read
      # from the resolved platform so it follows platform bumps instead of
      # pinning an Arduino core version here. Emits nothing for the classic
      # espressif32 platform, where the package is not optional.
      - name: Pre-install optional Arduino framework package
        run: |
          pio pkg install -e "${{ steps.meta.outputs.env_name }}"
          URL=$(python3 -c "
          import json, pathlib
          p = pathlib.Path.home() / '.platformio/platforms/espressif32/platform.json'
          d = json.load(p.open()).get('packages', {}).get('framework-arduinoespressif32', {})
          v = str(d.get('version', ''))
          print(v if d.get('optional') and v.startswith('http') else '')
          ")
          if [ -n "$URL" ]; then
            pio pkg install --global --tool "$URL"
          else
            echo "framework-arduinoespressif32 is not an optional URL package - nothing to do"
          fi

      - name: Build firmware
        env:
          FIRMWARE_VERSION: ${{ steps.meta.outputs.version }}
        # `pio run` has died here without printing an exit code or an
        # error. Piping through tee hides the real status, so PIPESTATUS is
        # read back explicitly; df/free bracket the run because a runner out of
        # disk or memory is the most likely way a build vanishes silently.
        run: |
          df -h /; free -h
          set +e
          pio run -e "${{ steps.meta.outputs.env_name }}" 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          echo "=== pio exit code: $code"
          df -h /; free -h
          echo "=== last 40 lines"; tail -40 build.log
          exit $code

      - name: Verify firmware binary
        id: fw
        shell: bash
        run: |
          FW=".pio/build/${{ steps.meta.outputs.env_name }}/firmware.bin"
          if [ ! -f "$FW" ]; then
            echo "Firmware not found: $FW"
            exit 1
          fi
          ls -lh "$FW"
          echo "path=$FW" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ENV_NAME: ${{ steps.meta.outputs.env_name }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
          GENERATE_NOTES: ${{ github.event.inputs.generate_notes }}
          FW_PATH: ${{ steps.fw.outputs.path }}
        run: |
          ASSET_NAME="firmware-${ENV_NAME}.bin"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating asset..."
            gh release upload "$TAG" "${FW_PATH}#${ASSET_NAME}" --clobber
          else
            EXTRA_ARGS=()
            [ "$PRERELEASE" = "true" ] && EXTRA_ARGS+=("--prerelease")
            if [ "$GENERATE_NOTES" != "false" ]; then
              EXTRA_ARGS+=("--generate-notes")
            else
              EXTRA_ARGS+=("--notes" "Automated release for ${TAG}")
            fi
            gh release create "$TAG" "${FW_PATH}#${ASSET_NAME}" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              "${EXTRA_ARGS[@]}"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare OTA pages
        shell: bash
        env:
          ENV_NAME: ${{ steps.meta.outputs.env_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          FW_PATH: ${{ steps.fw.outputs.path }}
        run: |
          BASE_URL="https://${OWNER}.github.io/${REPO}"
          for OTA_DIR in "ota" "ota/staging"; do
            mkdir -p "dist/${OTA_DIR}"
            cp "$FW_PATH" "dist/${OTA_DIR}/firmware.bin"
            printf '{\n  "version": "%s",\n  "url": "%s/%s/firmware.bin"\n}\n' \
              "$VERSION" "$BASE_URL" "$OTA_DIR" > "dist/${OTA_DIR}/manifest.json"
          done
          echo "PROD    manifest: ${BASE_URL}/ota/manifest.json → v${VERSION}"
          echo "STAGING manifest: ${BASE_URL}/ota/staging/manifest.json → v${VERSION}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
