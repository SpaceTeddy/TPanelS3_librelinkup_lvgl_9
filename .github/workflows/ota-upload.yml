name: OTA Upload

on:
  workflow_dispatch:
    inputs:
      firmware_path:
        description: "Path to existing firmware binary (e.g. .pio/build/main/firmware.bin)"
        required: true
        default: ".pio/build/main/firmware.bin"
      upload_url:
        description: "OTA base URL, e.g. http://192.168.0.76/update (optional if secret is set)"
        required: false
        default: ""
      use_auth:
        description: "Use HTTP digest auth from secrets OTA_USERNAME / OTA_PASSWORD"
        required: true
        default: "false"

jobs:
  ota-upload:
    # OTA to local devices requires network access from your own runner
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OTA upload dependencies
        run: pip install --upgrade requests

      - name: Resolve OTA target URL
        id: target
        shell: bash
        env:
          INPUT_URL: ${{ github.event.inputs.upload_url }}
          SECRET_URL: ${{ secrets.OTA_UPLOAD_URL }}
        run: |
          URL="$INPUT_URL"
          if [ -z "$URL" ]; then
            URL="$SECRET_URL"
          fi
          if [ -z "$URL" ]; then
            echo "No OTA URL provided. Set workflow input 'upload_url' or secret 'OTA_UPLOAD_URL'."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify firmware file exists
        shell: bash
        run: |
          FILE="${{ github.event.inputs.firmware_path }}"
          if [ ! -f "$FILE" ]; then
            echo "Firmware file not found: $FILE"
            exit 1
          fi
          ls -lh "$FILE"

      - name: OTA upload (no auth)
        if: ${{ github.event.inputs.use_auth != 'true' }}
        env:
          OTA_URL: ${{ steps.target.outputs.url }}
          FIRMWARE_PATH: ${{ github.event.inputs.firmware_path }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import requests
          from urllib.parse import urlparse

          upload_url = os.environ["OTA_URL"]
          firmware = os.environ["FIRMWARE_PATH"]
          base_url = upload_url.replace("/update", "")
          host_ip = urlparse(base_url).netloc

          with open(firmware, "rb") as f:
              data = f.read()
          md5 = hashlib.md5(data).hexdigest()

          headers = {
              "Host": host_ip,
              "User-Agent": "GitHubActions-OTA",
              "Referer": f"{base_url}/update",
              "Connection": "keep-alive",
          }

          start = requests.get(f"{base_url}/ota/start?mode=fr&hash={md5}", headers=headers, timeout=15)
          if start.status_code != 200:
              raise SystemExit(f"OTA start failed: {start.status_code} {start.text}")

          with open(firmware, "rb") as f:
              files = {"firmware": ("firmware.bin", f, "application/octet-stream")}
              form = {"MD5": md5}
              r = requests.post(f"{base_url}/ota/upload", data=form, files=files, headers=headers, timeout=180)

          if r.status_code != 200:
              raise SystemExit(f"OTA upload failed: {r.status_code} {r.text}")
          print("OTA upload successful:", r.text)
          PY

      - name: OTA upload (digest auth)
        if: ${{ github.event.inputs.use_auth == 'true' }}
        env:
          OTA_URL: ${{ steps.target.outputs.url }}
          FIRMWARE_PATH: ${{ github.event.inputs.firmware_path }}
          OTA_USERNAME: ${{ secrets.OTA_USERNAME }}
          OTA_PASSWORD: ${{ secrets.OTA_PASSWORD }}
        run: |
          if [ -z "$OTA_USERNAME" ] || [ -z "$OTA_PASSWORD" ]; then
            echo "use_auth=true requires secrets OTA_USERNAME and OTA_PASSWORD"
            exit 1
          fi
          python - <<'PY'
          import hashlib
          import os
          import requests
          from requests.auth import HTTPDigestAuth
          from urllib.parse import urlparse

          upload_url = os.environ["OTA_URL"]
          firmware = os.environ["FIRMWARE_PATH"]
          username = os.environ["OTA_USERNAME"]
          password = os.environ["OTA_PASSWORD"]
          base_url = upload_url.replace("/update", "")
          host_ip = urlparse(base_url).netloc
          auth = HTTPDigestAuth(username, password)

          with open(firmware, "rb") as f:
              data = f.read()
          md5 = hashlib.md5(data).hexdigest()

          headers = {
              "Host": host_ip,
              "User-Agent": "GitHubActions-OTA",
              "Referer": f"{base_url}/update",
              "Connection": "keep-alive",
          }

          start = requests.get(f"{base_url}/ota/start?mode=fr&hash={md5}", headers=headers, auth=auth, timeout=15)
          if start.status_code != 200:
              raise SystemExit(f"OTA start failed: {start.status_code} {start.text}")

          with open(firmware, "rb") as f:
              files = {"firmware": ("firmware.bin", f, "application/octet-stream")}
              form = {"MD5": md5}
              r = requests.post(f"{base_url}/ota/upload", data=form, files=files, headers=headers, auth=auth, timeout=180)

          if r.status_code != 200:
              raise SystemExit(f"OTA upload failed: {r.status_code} {r.text}")
          print("OTA upload successful:", r.text)
          PY
