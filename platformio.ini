; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
;platform = espressif32 @7.0.1
platform = http://github.com/pioarduino/platform-espressif32.git
board = esp32s3_flash_16MB
framework = arduino
build_type = release
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.memory_type = qio_qspi
board_build.partitions = partitions_16mb_ota3m5.csv
build_flags = 
	-D CORE_DEBUG_LEVEL=1
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_RUNNING_CORE=1
	-D ARDUINO_EVENT_RUNNING_CORE=1
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-DLV_CONF_PATH=\"${PROJECT_DIR}/include/lv_conf.h\"
	-DLV_CONF_SUPPRESS_DEFINE_CHECK=1
	-DFW_UPDATE_MANIFEST_URL=\"https://spaceteddy.github.io/TPanelS3_librelinkup_lvgl_9/ota/manifest.json\"
	-DFW_UPDATE_MANIFEST_URL_STAGING=\"https://spaceteddy.github.io/TPanelS3_librelinkup_lvgl_9/ota/staging/manifest.json\"
	-DFW_UPDATE_CHECK_INTERVAL_MS=600000

[platformio]
boards_dir = ./boards
src_dir = app/${platformio.default_envs}
default_envs = main

[env:main]
; ESP-IDF options, applied by pioarduino only (the classic espressif32
; platform ships prebuilt libs and ignores this). Removing an option here does
; NOT revert it -- sdkconfig.main is authoritative once it exists, so any
; change needs `rm sdkconfig.main` first. Full reasoning and the dead ends
; already ruled out: docs/pitfalls.md, docs/build-and-flash.md.
custom_sdkconfig =
	; Required, not redundant: custom_sdkconfig builds the IDF from source, so
	; the config comes from IDF's own Kconfig defaults -- and there SPIRAM is
	; "default n". The sdkconfig shipped in framework-arduinoespressif32-libs
	; only documents how the *prebuilt* libs were built and is not the base
	; here. Removing these two disables PSRAM (2026-08-30, cost a broken build).
	CONFIG_SPIRAM=y
	CONFIG_SPIRAM_MODE_QUAD=y
	; Code and rodata in PSRAM: execution no longer stalls on the flash cache,
	; which is what tore the RGB panel during LittleFS writes and OTA.
	CONFIG_SPIRAM_XIP_FROM_PSRAM=y
	; 16 KB in / 4 KB out instead of 16 KB both ways: halves the contiguous
	; internal RAM a TLS session needs. Keep IN at 16384, a server may send a
	; full-size record. Do NOT use MBEDTLS_EXTERNAL_MEM_ALLOC -- TLS buffers in
	; PSRAM fix the allocation but bring the display flicker back.
	CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
	CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
	CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
	; WiFi/lwIP buffers kept in internal RAM (2026-08-29). They were moved to
	; PSRAM when the internal heap trough hit 88 bytes; since the LVGL pool went
	; to PSRAM that trough is ~92 KB, so the reason is gone. Keeping them
	; internal takes ~50 blocks of packet traffic off the PSRAM bus during a
	; fetch -- the window in which the display tears.
	CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=n
	; Off (Kconfig default; the Arduino base config turns it on). On, the driver
	; resets the GDMA channel every VBlank -- and a late reset shifts the picture
	; itself. Off, it only restarts on a genuinely missed EOF.
	CONFIG_LCD_RGB_RESTART_IN_VSYNC=n

lib_deps =
	https://github.com/SpaceTeddy/TPanelS3ArduinoSupport.git
	https://github.com/SpaceTeddy/LibreLinkUpESP32.git
	https://github.com/SpaceTeddy/WireGuard-ESP32-Arduino.git
	https://github.com/SpaceTeddy/mcu-uuid-console.git
	https://github.com/nomis/mcu-uuid-telnet
	https://github.com/Links2004/arduinoWebSockets.git@^2.7.2
	https://github.com/ayushsharma82/ElegantOTA.git
	bblanchon/ArduinoJson@^7.2.2
	bblanchon/StreamUtils@^1.9.0
	knolleary/PubSubClient@^2.8
	gyverlibs/StringUtils@^1.5.1
	
board_build.embed_files = data/cert/x509_crt_bundle.bin
extra_scripts = pre:get_version.py, post:ldflags_compat.py, platformio_upload.py
upload_protocol = custom
custom_upload_url = http://192.168.0.76/update
;custom_upload_url = http://192.168.0.103/update