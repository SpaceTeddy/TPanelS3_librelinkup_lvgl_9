; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
;platform = espressif32 @7.0.1
platform = http://github.com/pioarduino/platform-espressif32.git
board = esp32s3_flash_16MB
framework = arduino
build_type = release
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.memory_type = qio_qspi
board_build.partitions = partitions_16mb_ota3m5.csv
build_flags = 
	-D CORE_DEBUG_LEVEL=1
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_RUNNING_CORE=1
	-D ARDUINO_EVENT_RUNNING_CORE=1
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-DLV_CONF_PATH=\"${PROJECT_DIR}/include/lv_conf.h\"
	-DLV_CONF_SUPPRESS_DEFINE_CHECK=1
	-DFW_UPDATE_MANIFEST_URL=\"https://spaceteddy.github.io/TPanelS3_librelinkup_lvgl_9/ota/manifest.json\"
	-DFW_UPDATE_MANIFEST_URL_STAGING=\"https://spaceteddy.github.io/TPanelS3_librelinkup_lvgl_9/ota/staging/manifest.json\"
	-DFW_UPDATE_CHECK_INTERVAL_MS=600000

[platformio]
boards_dir = ./boards
src_dir = app/${platformio.default_envs}
default_envs = main

[env:main]
; Add custom sdkconfig options for PSRAM support, that LVGL does not flicker while LittleFS access.
custom_sdkconfig =
	CONFIG_SPIRAM=y
	CONFIG_SPIRAM_MODE_QUAD=y
	CONFIG_SPIRAM_XIP_FROM_PSRAM=y
	; TLS buffer sizing. The problem being solved: mbedTLS needs contiguous
	; buffers per session, the internal heap fragments under load (telnet
	; sessions, web dashboard) and offered only ~17 KB in one piece while
	; 58 KB were free in total -- handshakes then failed with
	; "SSL - Memory allocation failed".
	;
	; ESP-IDF defaults MBEDTLS_ASYMMETRIC_CONTENT_LEN to y (16384 in / 4096
	; out), but the Arduino build disables it and forces 16 KB in BOTH
	; directions. Re-enabling it saves 12 KB per connection and drops the
	; requirement from 2x16 KB to 16 KB + 4 KB -- which fits the fragmented
	; heap without moving anything to PSRAM.
	;
	; Do NOT use CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC here: putting the TLS
	; buffers in PSRAM does fix the allocation, but the extra traffic on that
	; bus competes with the RGB panel's DMA and brings the display flicker
	; back.
	;
	; Keep IN at 16384: TLS permits records up to 16 KB, and a server sending
	; one would tear down the connection.
	CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
	CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
	CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

lib_deps =
	https://github.com/SpaceTeddy/TPanelS3ArduinoSupport.git
	https://github.com/SpaceTeddy/LibreLinkUpESP32.git
	https://github.com/SpaceTeddy/WireGuard-ESP32-Arduino.git
	https://github.com/SpaceTeddy/mcu-uuid-console.git
	https://github.com/nomis/mcu-uuid-telnet
	https://github.com/Links2004/arduinoWebSockets.git@^2.7.2
	https://github.com/ayushsharma82/ElegantOTA.git
	bblanchon/ArduinoJson@^7.2.2
	bblanchon/StreamUtils@^1.9.0
	knolleary/PubSubClient@^2.8
	gyverlibs/StringUtils@^1.5.1
	
board_build.embed_files = data/cert/x509_crt_bundle.bin
extra_scripts = pre:get_version.py, post:ldflags_compat.py, platformio_upload.py
upload_protocol = custom
custom_upload_url = http://192.168.0.76/update
;custom_upload_url = http://192.168.0.103/update
